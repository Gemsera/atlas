<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas Passive Tree Planner — PoE1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a; --panel:#111214f2; --panel2:#17181b; --line:#2c2a25; --text:#d8d2c4; --dim:#8b8578;
  --gold:#c8a65a; --gold2:#e9cf8a; --blue:#7fb6e0; --red:#d8665a; --notable:#e0c06a; --keystone:#e8a24a; --flav:#b4743c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas#tree{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#tree.dragging{cursor:grabbing}
canvas#tree.pointer{cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;
  background:linear-gradient(#0b0c0ef5,#0b0c0ed0);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
h1{font:700 15px Cinzel,serif;letter-spacing:.06em;color:var(--gold2);margin:0 6px 0 2px;white-space:nowrap}
h1 small{font:500 11px Inter,sans-serif;color:var(--dim);letter-spacing:0;margin-left:6px}
.grow{flex:1}
select,input,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #37342d;border-radius:6px;padding:6px 10px;height:34px}
select:focus,input:focus{outline:1px solid var(--gold);outline-offset:0}
button{cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--gold);color:var(--gold2)}
button.primary{background:linear-gradient(#5a4520,#3b2d14);border-color:#8a6a2c;color:var(--gold2)}
button:disabled{opacity:.4;cursor:default;border-color:#37342d;color:var(--text)}
#search{width:200px}
.points{font:700 15px Cinzel,serif;color:var(--gold2);padding:0 8px;white-space:nowrap}
.points.over{color:var(--red)}
.points span{font:500 11px Inter,sans-serif;color:var(--dim);margin-left:3px}
#matchinfo{font-size:12px;color:var(--dim);min-width:0}
#panel{position:fixed;z-index:4;right:0;top:var(--hh,51px);bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s}
#panel.hidden{transform:translateX(100%)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;height:40px;color:var(--dim);font:600 12px Inter;letter-spacing:.08em;text-transform:uppercase}
.tabs button.on{color:var(--gold2);box-shadow:inset 0 -2px var(--gold)}
.tabs .x{flex:0 0 44px;font-size:18px}
.pbody{overflow:auto;padding:14px 16px 24px;flex:1}
.empty{color:var(--dim);font-size:13px}
.nname{font:700 17px Cinzel,serif;margin:0 0 2px}
.ntype{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.stat{color:#9fb6e8;margin:3px 0;white-space:pre-line}
.rem{color:var(--dim);font-style:italic;font-size:12.5px;margin:6px 0;white-space:pre-line}
.flav{color:var(--flav);font-style:italic;margin-top:10px;white-space:pre-line}

.sumh{font:700 12px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.sumh:first-child{margin-top:0}
.chip{display:inline-block;padding:3px 8px;margin:2px 4px 2px 0;border-radius:12px;background:#221d13;border:1px solid #4a3c20;font-size:12px;cursor:pointer}
.chip.k{background:#2a1a0c;border-color:#7a4a1c;color:#f0c08a}
.srow{display:flex;gap:8px;margin:3px 0;font-size:13px}
.srow .stat{margin:0;flex:1}
.srow .cnt{color:var(--dim);font-size:11px;padding-top:2px}
#tip{position:fixed;z-index:6;pointer-events:none;max-width:340px;background:#0c0c0ef5;border:1px solid #4a4130;border-radius:6px;padding:10px 12px;box-shadow:0 6px 24px #000a;display:none}
#tip .nname{font-size:15px}
#tip .hint{margin-top:8px;font-size:12px;color:var(--dim);border-top:1px solid #2a2720;padding-top:6px}
.hint b{color:var(--blue)} .hint b.r{color:var(--red)}
dialog{background:#121315;color:var(--text);border:1px solid #4a4130;border-radius:10px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px #000c}
dialog::backdrop{background:#000a}
.dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{font:700 15px Cinzel,serif;color:var(--gold2);margin:0;flex:1}
.db{padding:14px 16px 18px}
.db label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.db label:first-child{margin-top:0}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
textarea{width:100%;min-height:70px;font:12px ui-monospace,monospace;color:var(--text);background:var(--panel2);border:1px solid #37342d;border-radius:6px;padding:8px;resize:vertical}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.err{color:var(--red)}
.ok{color:#8fd08f}
.mrow{padding:10px 0;border-bottom:1px solid #24221d}
.mtop{display:flex;align-items:center;gap:8px}
.mname{flex:1;font-weight:600;color:var(--text)}
.badge{font:700 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.badge.g{background:#173a1f;color:#8fe39b;border:1px solid #2f7a3e}
.badge.p{background:#2a2414;color:var(--gold2);border:1px solid #6a5426}
.badge.i{background:#16222f;color:var(--blue);border:1px solid #2c4d6c}
.mdet{font-size:12.5px;color:var(--dim);margin-top:4px}
.mdet b{color:var(--text);font-weight:600}
.bar{height:5px;background:#24221d;border-radius:3px;margin-top:6px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6a2c,#e9cf8a);border-radius:3px}
.bar i.g{background:linear-gradient(90deg,#2f7a3e,#8fe39b)}
.mlink{background:none;border:0;height:auto;padding:0;color:var(--gold);font-size:12px;cursor:pointer;margin-left:6px}
.mlink:hover{color:var(--gold2)}
.mnote{font-size:12px;color:var(--dim);background:#17181b;border:1px solid #2a2720;border-radius:6px;padding:8px 10px;margin-bottom:6px}
.tipm{margin-top:6px;font-size:12px}
.tipm div{margin:2px 0}
.tipm .gg{color:#8fe39b}
#spawnBtn .n{color:#8fe39b;font-weight:600}
#toast{position:fixed;z-index:9;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1a12;border:1px solid var(--gold);color:var(--gold2);padding:8px 14px;border-radius:8px;display:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 16px Cinzel,serif;color:var(--gold);z-index:10;background:var(--bg)}
#zoom{position:fixed;z-index:3;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;padding:0;font-size:18px;background:#111214e0}
#panelToggle{display:none}
.brk{display:none;flex-basis:100%;height:0}
@media (max-width:760px){
  header{gap:6px;padding:6px 8px}
  h1 small{display:none}
  header > *{order:5}
  h1{order:0} #treeSel{order:1} #points{order:2} #spawnBtn{order:3} .brk{order:4;display:block} #shareBtn{order:3;margin-left:auto}
  #search{width:auto;flex:1;min-width:0}
  header button{padding:6px 9px}
  .wide{display:none}
  #panel{top:auto;left:0;width:auto;height:46vh;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0}
  #panel.hidden{transform:translateY(100%)}
  #panelToggle{display:inline-block}
}
</style>
</head>
<body>
<canvas id="tree"></canvas>
<header>
  <h1>Atlas Tree<small id="ver"></small></h1>
  <select id="treeSel" title="Tree variant">
    <option value="standard">Standard</option>
    <option value="ruthless">Ruthless</option>
  </select>
  <div class="points" id="points">0<span>/ 150</span></div>
  <input id="search" type="search" placeholder="Search nodes… (Enter to jump)" autocomplete="off">
  <span id="matchinfo" class="wide"></span>
  <div class="grow wide"></div>
  <div class="brk"></div>
  <button id="spawnBtn" title="Content the allocated nodes guarantee"><span class="n">✓ 0</span><span class="wide"> guaranteed</span></button>
  <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button id="resetBtn">Reset</button>
  <button id="panelToggle">Details</button>
  <button id="shareBtn" class="primary">Share</button>
</header>

<aside id="panel">
  <div class="tabs">
    <button data-tab="node" class="on">Node</button>
    <button data-tab="spawns">Spawns</button>
    <button data-tab="summary">Summary</button>
    <button class="x" id="closePanel" title="Hide panel">×</button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<div id="zoom">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="zfit" title="Fit tree">⤢</button>
</div>

<div id="tip"></div>
<div id="toast"></div>
<div id="loading">Loading atlas…</div>

<dialog id="shareDlg">
  <div class="dh"><h2>Share &amp; import</h2><button id="dlgClose">Close</button></div>
  <div class="db">
    <label>Short link</label>
    <div class="row"><input id="shareLink" readonly><button id="copyLink" class="primary">Copy</button></div>
    <div class="note">Anyone opening this link sees exactly your allocations (and chosen variant effects). The page's address also updates as you allocate.</div>
    <label>Long link <span style="opacity:.7">— keeps working after future tree updates</span></label>
    <div class="row"><input id="longLink" readonly><button id="copyLong">Copy</button></div>
    <label>pathofexile.com tree code</label>
    <div class="row"><input id="officialCode" readonly><button id="copyOfficial">Copy</button></div>
    <div class="note" id="officialNote"></div>
    <label>Import a tree</label>
    <textarea id="importText" placeholder="Paste a link from this planner, a pathofexile.com atlas tree URL, or a tree code"></textarea>
    <div class="row" style="margin-top:8px"><button id="importBtn" class="primary">Import</button><span id="importMsg" class="note" style="align-self:center"></span></div>
  </div>
</dialog>

<script>
"use strict";
// Set after publishing so in-app share links point at the hosted page rather than the sandbox frame.
const ARTIFACT_URL = "";
const START_ID = 29045;
const SPRITE_SCALE = 2; // sprite sheets are the 0.5 zoom level
const TYPE_LABEL = {normal:"Passive", notable:"Notable", keystone:"Keystone", wormhole:"Gateway", start:"Start", mastery:"Mastery"};
const TYPE_COLOR = {normal:"#d8d2c4", notable:"#e0c06a", keystone:"#e8a24a", wormhole:"#a6c8ff", mastery:"#c8a65a", start:"#d8d2c4"};
const HIT_R = {normal:42, notable:62, keystone:90, wormhole:110};
const FRAME = {
  normal:   {u:"PSSkillFrame", c:"PSSkillFrameHighlighted", a:"PSSkillFrameActive"},
  notable:  {u:"NotableFrameUnallocated", c:"NotableFrameCanAllocate", a:"NotableFrameAllocated"},
  keystone: {u:"KeystoneFrameUnallocated", c:"KeystoneFrameCanAllocate", a:"KeystoneFrameAllocated"},
  wormhole: {u:"WormholeFrameUnallocated", c:"WormholeFrameCanAllocate", a:"WormholeFrameAllocated"},
};

const $ = s => document.querySelector(s);
const canvas = $("#tree"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
const cam = {x:0, y:0, s:0.05};
let sprites = null; const images = {};
const treeCache = {};
const st = {
  key:"standard", tree:null, byId:new Map(), adj:new Map(), groupNodes:new Map(),
  alloc:new Set([START_ID]), variants:new Map(),
  hover:null, selected:null, addPath:new Set(), removeSet:new Set(),
  matches:[], matchSet:new Set(), matchIdx:-1, history:[], tab:"node"
};
let dirty = true;
const redraw = () => { dirty = true; };

/* ---------- loading ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("image " + src)); i.src = src; }); }
async function loadSprites(){
  sprites = await (await fetch("sprites.json")).json();
  const files = new Set(Object.values(sprites).map(s => s.file));
  await Promise.all([...files].map(async f => { images[f] = await loadImg(f); }));
  bgPattern = ctx.createPattern(images[sprites.background.file], "repeat");
}
let bgPattern = null;
async function loadTree(key){
  if (!treeCache[key]) treeCache[key] = await (await fetch(`tree-${key}.json`)).json();
  const t = treeCache[key];
  st.key = key; st.tree = t; st.byId = new Map(); st.adj = new Map(); st.groupNodes = new Map();
  for (const n of t.nodes){
    st.byId.set(n.id, n);
    if (n.t !== "mastery") st.adj.set(n.id, []);
    if (!st.groupNodes.has(n.g)) st.groupNodes.set(n.g, []);
    st.groupNodes.get(n.g).push(n);
  }
  for (const e of t.edges){
    if (!st.adj.has(e.a) || !st.adj.has(e.b)) continue;
    st.adj.get(e.a).push(e.b); st.adj.get(e.b).push(e.a);
    if (e.c){ // precompute arc geometry
      const A = st.byId.get(e.a), B = st.byId.get(e.b);
      const r = Math.hypot(A.x - e.c[0], A.y - e.c[1]);
      let a1 = Math.atan2(A.y - e.c[1], A.x - e.c[0]), a2 = Math.atan2(B.y - e.c[1], B.x - e.c[0]);
      let d = a2 - a1; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
      e.arc = {r, a1, a2: a1 + d, ccw: d < 0};
    }
  }
  indexMechanics();
  for (const list of st.adj.values()) list.sort((a, b) => a - b);
  $("#ver").textContent = t.version === "Atlas" ? "PoE1 · 3.30 data" : t.version;
  $("#treeSel").value = key;
}

/* ---------- graph logic ---------- */
function pathTo(target){
  if (st.alloc.has(target) || !st.adj.has(target)) return [];
  const prev = new Map(); const q = [];
  for (const id of st.alloc){ prev.set(id, null); q.push(id); }
  for (let qi = 0; qi < q.length; qi++){
    const cur = q[qi];
    if (cur === target) break;
    for (const nb of st.adj.get(cur) || []){
      if (prev.has(nb)) continue;
      prev.set(nb, cur); q.push(nb);
    }
  }
  if (!prev.has(target)) return [];
  const path = []; let c = target;
  while (c != null && !st.alloc.has(c)){ path.push(c); c = prev.get(c); }
  return path;
}
function reachable(set){
  const seen = new Set([START_ID]); const q = [START_ID];
  for (let i = 0; i < q.length; i++) for (const nb of st.adj.get(q[i]) || []) if (set.has(nb) && !seen.has(nb)){ seen.add(nb); q.push(nb); }
  return seen;
}
function removalFor(id){
  if (!st.alloc.has(id) || id === START_ID) return new Set();
  const rest = new Set(st.alloc); rest.delete(id);
  const keep = reachable(rest);
  const out = new Set([id]);
  for (const a of rest) if (!keep.has(a)) out.add(a);
  return out;
}
function snapshot(){ st.history.push({a:[...st.alloc], v:[...st.variants]}); if (st.history.length > 200) st.history.shift(); $("#undoBtn").disabled = false; }
function toggle(id){
  const n = st.byId.get(id); if (!n || n.t === "mastery" || n.t === "start") return;
  snapshot();
  if (st.alloc.has(id)){
    for (const r of removalFor(id)){ st.alloc.delete(r); st.variants.delete(r); }
  } else {
    const p = pathTo(id); if (!p.length){ st.history.pop(); return; }
    for (const x of p){ st.alloc.add(x); const pn = st.byId.get(x); if (pn.v && !st.variants.has(x)) st.variants.set(x, 0); }
  }
  changed();
}
function changed(announce = true){ refreshPreview(); updatePoints(); updateMechanics(announce); writeHash(); renderPanel(); redraw(); }
function undo(){
  const h = st.history.pop(); if (!h) return;
  st.alloc = new Set(h.a); st.variants = new Map(h.v);
  $("#undoBtn").disabled = !st.history.length; changed();
}
function reset(){ if (st.alloc.size <= 1) return; snapshot(); st.alloc = new Set([START_ID]); st.variants.clear(); changed(); }
function used(){ return st.alloc.size - 1; }
function updatePoints(){
  const el = $("#points"), u = used(), tot = st.tree.points;
  el.innerHTML = `${u}<span>/ ${tot}</span>`; el.classList.toggle("over", u > tot);
  el.title = u > tot ? `${u - tot} points over the ${tot} available` : `${tot - u} points left`;
}
function refreshPreview(){
  st.addPath = new Set(); st.removeSet = new Set();
  const id = st.hover ?? (touchMode ? st.selected : null);
  if (id == null) return;
  if (st.alloc.has(id)) st.removeSet = removalFor(id); else st.addPath = new Set(pathTo(id));
}

/* ---------- league mechanic spawn chances ---------- */
const MECH_LABEL = {
  "sacred flora":"Harvest (Sacred Flora)", "rogue exile":"Rogue Exiles", "shrine":"Shrines", "strongbox":"Strongboxes",
  "imprisoned monster":"Essences (Imprisoned Monsters)", "ore deposits":"Ore Deposits", "multiple ore deposits":"Multiple Ore Deposits",
  "trial of ascendancy":"Labyrinth Trial", "tormented spirit":"Tormented Spirits", "mercenary":"Mercenaries",
  "mirror of delirium":"Delirium (Mirror)", "demonic evocator":"Beyond (Demonic Evocator)", "viridian wildwood":"Viridian Wildwood",
  "mirage":"Mirage", "buried sentinel":"Buried Sentinel", "atlas anomalies":"Atlas Anomalies",
  "certain tormented spirits":"Specific Tormented Spirits", "packs with mirrored rare monsters":"Mirrored Rare packs",
  "packs of divination-touched magic monsters":"Divination-Touched packs", "pack of incursion monsters":"Incursion packs",
  "apparition shrine":"Apparition Shrine", "memory tears (tier 16+)":"Memory Tears (T16+)"
};
const NUM = "(\\d+(?:\\.\\d+)?)", TO = "to (?:contain|be haunted by|be inhabited by)";
const MECH_RULES = [
  {kind:"surpass", re:new RegExp(`^Your Maps have \\+?${NUM}% Surpassing Chance ${TO} (.+)$`, "i")},
  {kind:"flat",    re:new RegExp(`^Your Maps have \\+${NUM}% chance ${TO} (.+)$`, "i")},
  {kind:"inc",     re:new RegExp(`^Your Maps have ${NUM}% increased chance ${TO} (.+)$`, "i")},
  {kind:"inc",     re:new RegExp(`^${NUM}% increased chance for your Maps to contain (.+)$`, "i")},
  {kind:"inc",     re:new RegExp(`^${NUM}% increased chance for (Atlas Anomalies) to manifest in your Maps$`, "i")},
  {kind:"extra",   re:/^Your Maps (?:contains?|are inhabited by) (an|a|\d+) additional (.+)$/i},
];
function mechKey(t){ return t.trim().replace(/^(an?|the) /i, "").replace(/\.$/, "").toLowerCase(); }
function mechLabel(k){ return MECH_LABEL[k] || k.replace(/(^|\s)\S/g, c => c.toUpperCase()); }
function parseMech(lines){
  const out = [];
  for (const raw of lines || []){
    const line = raw.replace(/\s*\n\s*/g, " ").trim();
    for (const r of MECH_RULES){
      const m = line.match(r.re); if (!m) continue;
      const val = r.kind === "extra" ? (/^\d+$/.test(m[1]) ? +m[1] : 1) : +m[1];
      out.push({key:mechKey(m[2]), kind:r.kind, val}); break;
    }
  }
  return out;
}
function indexMechanics(){
  st.mechNodes = new Map();
  for (const n of st.tree.nodes){
    n.mech = parseMech(n.s);
    n.vmech = n.v ? n.v.map(v => parseMech(v.s)) : null;
    const keys = new Set([...n.mech, ...(n.vmech || []).flat()].map(m => m.key));
    for (const k of keys){ if (!st.mechNodes.has(k)) st.mechNodes.set(k, []); st.mechNodes.get(k).push(n); }
  }
}
function mechStats(set, variants = st.variants){
  const res = new Map();
  for (const k of st.mechNodes.keys()) res.set(k, {key:k, surpass:0, flat:0, inc:0, extra:0, n:0});
  for (const id of set){
    const n = st.byId.get(id); if (!n) continue;
    const list = n.vmech ? n.mech.concat(n.vmech[variants.get(id) ?? 0] || []) : n.mech;
    for (const m of list){ const r = res.get(m.key); r[m.kind] += m.val; r.n++; }
  }
  for (const r of res.values()){
    r.chance = r.surpass + r.flat;
    r.count = r.extra + (r.surpass ? Math.floor(r.chance / 100) : r.flat >= 100 ? 1 : 0);
    r.rem = r.surpass ? +(r.chance % 100).toFixed(2) : r.flat >= 100 ? 0 : r.chance;
    r.guaranteed = r.count > 0;
  }
  return res;
}
function mechLine(r){
  if (r.guaranteed){
    if (r.surpass || r.extra) return `${r.count} guaranteed` + (r.rem ? ` + ${fmtNum(r.rem)}% for another` : "");
    return "Guaranteed";
  }
  if (r.chance) return `${fmtNum(r.chance)}% from tree`;
  if (r.inc) return `+${fmtNum(r.inc)}% increased`;
  return "0%";
}
function guaranteedKeys(set){ return new Set([...mechStats(set).values()].filter(r => r.guaranteed).map(r => r.key)); }
let lastGuaranteed = new Set();
function updateMechanics(announce){
  const now = guaranteedKeys(st.alloc);
  $("#spawnBtn .n").textContent = "✓ " + now.size;
  if (announce){

    cam.s = ns; cam.x = wx - (mx - W/2) / ns; cam.y = wy - (my - H/2) / ns; redraw(); return;
  }
  if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > (e.pointerType === "mouse" ? 4 : 9)){ drag.moved = true; canvas.classList.add("dragging"); hideTip(); }
    if (drag.moved){ cam.x = drag.cx - dx / cam.s; cam.y = drag.cy - dy / cam.s; redraw(); }
    return;
  }
  if (e.pointerType === "mouse") hoverAt(e.clientX, e.clientY);
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && ptrs.size === 0){
    const wasTap = !drag.moved && performance.now() - drag.t < 600;
    canvas.classList.remove("dragging");
    if (wasTap && e.type === "pointerup") tap(e.clientX, e.clientY, e.pointerType, drag.button);
    drag = null;
  }
}
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !drag){ st.hover = null; hideTip(); refreshPreview(); redraw(); } });
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), e.clientX, e.clientY); if (st.hover != null) hoverAt(e.clientX, e.clientY); }, {passive:false});
canvas.addEventListener("contextmenu", e => e.preventDefault());

function hoverAt(x, y){
  const n = nodeAt(x, y, false);
  const id = n ? n.id : null;
  canvas.classList.toggle("pointer", !!n);
  if (id !== st.hover){ st.hover = id; refreshPreview(); redraw(); }
  if (n) showTip(n, x, y); else hideTip();
}
function tap(x, y, type, button){
  const n = nodeAt(x, y, type !== "mouse");
  if (type === "mouse"){
    if (!n) return;
    if (button === 2){ select(n.id); return; }
    toggle(n.id); select(n.id, false); hoverAt(x, y);
  } else {
    if (!n){ st.selected = null; refreshPreview(); renderPanel(); redraw(); return; }
    select(n.id, true);
  }
}
function select(id, open = true){
  st.selected = id; refreshPreview();
  if (open || st.tab === "node"){ st.tab = "node"; setTab("node"); }
  if (open) showPanel(true);
  renderPanel(); redraw();
}

/* ---------- tooltip & panel ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nodeHTML(n, inTip){
  let h = `<div class="nname" style="color:${TYPE_COLOR[n.t]}">${esc(n.n || "Start")}</div><div class="ntype">${TYPE_LABEL[n.t]}${st.alloc.has(n.id) ? " · allocated" : ""}</div>`;
  for (const s of n.s || []) h += `<div class="stat">${esc(s)}</div>`;
  if (n.v){
    const cur = st.alloc.has(n.id) ? (st.variants.get(n.id) ?? 0) : -1;
    if (inTip){
      h += `<div class="rem">Choose one effect:</div>`;
      n.v.forEach((v, i) => { h += `<div class="stat" style="${i === cur ? "color:#e9cf8a" : ""}">${i === cur ? "◆ " : "◇ "}${esc(v.s.join("\n"))}</div>`; });
    } else {
      h += `<div class="rem">Choose one effect${cur < 0 ? " (allocate the node first)" : ""}:</div>`;
      n.v.forEach((v, i) => { h += `<label class="variant ${i === cur ? "on" : ""}"><input type="radio" name="var" value="${i}" ${i === cur ? "checked" : ""} ${cur < 0 ? "disabled" : ""}><span class="stat" style="margin:0">${esc(v.s.join("\n"))}</span></label>`; });
    }
  }
  for (const r of n.r || []) h += `<div class="rem">${esc(r)}</div>`;
  if (n.f) h += `<div class="flav">${esc(n.f.join("\n"))}</div>`;
  return h;
}
function actionInfo(n){
  if (st.alloc.has(n.id)){ const k = removalFor(n.id).size; return {remove:true, k}; }
  return {remove:false, k:pathTo(n.id).length};
}
function showTip(n, x, y){
  const tip = $("#tip"); const a = actionInfo(n);
  tip.innerHTML = nodeHTML(n, true) + `<div class="hint">${a.remove ? `Click to <b class="r">remove</b> (−${a.k} point${a.k === 1 ? "" : "s"})` : a.k ? `Click to <b>allocate</b> (+${a.k} point${a.k === 1 ? "" : "s"})` : "Not reachable"}${mechDiffHTML(n)}</div>`;
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let tx = x + 18, ty = y + 18;
  if (tx + r.width > W - 8) tx = x - r.width - 18;
  if (ty + r.height > H - 8) ty = Math.max(56, H - r.height - 8);
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
}
function hideTip(){ $("#tip").style.display = "none"; }
function setTab(t){ st.tab = t; document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t)); renderPanel(); }
function showPanel(on){ $("#panel").classList.toggle("hidden", !on); }

function fmtNum(x){ return Number.isInteger(x) ? String(x) : String(+x.toFixed(2)); }
function summary(){
  const agg = new Map(); const notables = [], keystones = [], gateways = [];
  for (const id of st.alloc){
    const n = st.byId.get(id); if (!n || n.t === "start") continue;
    if (n.t === "notable") notables.push(n); else if (n.t === "keystone") keystones.push(n); else if (n.t === "wormhole") gateways.push(n);
    let lines = n.s || [];
    if (n.v) lines = lines.concat(n.v[st.variants.get(id) ?? 0].s);
    for (const raw of lines){
      if (n.t === "wormhole") continue;
      const line = raw.replace(/\s*\n\s*/g, " ");
      // only percentages get summed; other numbers (tiers, counts like "1-15") stay part of the text
      const nums = (line.match(/\d+(?:\.\d+)?(?=%)/g) || []).map(Number);
      const tpl = line.replace(/\d+(?:\.\d+)?(?=%)/g, "#");
      const cur = agg.get(tpl);
      if (cur){ cur.n++; cur.nums = cur.nums.map((v, i) => v + (nums[i] || 0)); }
      else agg.set(tpl, {n:1, nums});
    }
  }
  return {agg, notables, keystones, gateways};
}
function renderPanel(){
  const body = $("#pbody");
  if (st.tab === "node"){
    const n = st.selected != null ? st.byId.get(st.selected) : null;
    if (!n){ body.innerHTML = `<div class="empty">${touchMode ? "Tap a node to see it here, then allocate it with the button." : "Hover a node for details. Click to allocate along the shortest path; click an allocated node to remove it (and anything that depends on it). Right-click to inspect without allocating."}</div>` + helpHTML(); return; }
    const a = actionInfo(n);
    body.innerHTML = nodeHTML(n, false) + `<div class="actions">${n.t === "start" ? "" : a.remove ? `<button id="actBtn">Remove (−${a.k})</button>` : `<button id="actBtn" class="primary" ${a.k ? "" : "disabled"}>Allocate (+${a.k})</button>`}<button id="locBtn">Center</button></div>` + (n.t !== "start" ? mechDiffHTML(n).replace('class="tipm"', 'class="tipm" style="margin-top:12px"') : "");
    body.querySelectorAll("input[name=var]").forEach(inp => inp.addEventListener("change", () => { snapshot(); st.variants.set(n.id, +inp.value); changed(); }));
    $("#actBtn")?.addEventListener("click", () => { toggle(n.id); });
    $("#locBtn").addEventListener("click", () => centerOn(n, .25));
  } else if (st.tab === "spawns"){
    body.innerHTML = spawnsHTML();
    body.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.k; highlightNodes(st.mechNodes.get(k) || [], mechLabel(k));
      if (W <= 760) showPanel(false);
    }));
  } else {
    const {agg, notables, keystones, gateways} = summary();
    if (st.alloc.size <= 1){ body.innerHTML = `<div class="empty">Nothing allocated yet.</div>`; return; }
    let h = "";
    if (keystones.length) h += `<div class="sumh">Keystones</div>` + keystones.map(n => `<span class="chip k" data-id="${n.id}">${esc(n.n)}</span>`).join("");
    if (notables.length) h += `<div class="sumh">Notables (${notables.length})</div>` + notables.sort((a,b) => a.n.localeCompare(b.n)).map(n => `<span class="chip" data-id="${n.id}">${esc(n.n)}</span>`).join("");
    if (gateways.length) h += `<div class="sumh">Gateways</div>` + gateways.map(n => `<span class="chip" data-id="${n.id}">${esc(n.n)}</span>`).join("");
    h += `<div class="sumh">Combined effects</div>`;
    const rows = [...agg].sort((a, b) => a[0].localeCompare(b[0]));
    for (const [tpl, v] of rows){ let i = 0; const text = tpl.replace(/#/g, () => fmtNum(v.nums[i++] ?? 0)); h += `<div class="srow"><div class="stat">${esc(text)}</div>${v.n > 1 ? `<span class="cnt">×${v.n}</span>` : ""}</div>`; }
    body.innerHTML = h;
    body.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { const n = st.byId.get(+c.dataset.id); select(n.id); centerOn(n, .2); }));
  }
}
function helpHTML(){
  return `<div class="sumh" style="margin-top:18px">Tips</div>
  <div class="rem" style="font-style:normal">• Drag to pan, scroll or pinch to zoom.<br>• Search highlights matching nodes in orange; press Enter to jump between them.<br>• Some notables let you pick one of two effects — choose it in this panel after allocating.<br>• Share copies a link with your whole tree in it. You can also import pathofexile.com atlas tree links.</div>`;
}

/* ---------- search ---------- */
function runSearch(q){
  q = q.trim().toLowerCase(); st.matchIdx = -1;
  if (q.length < 2){ st.matches = []; st.matchSet = new Set(); $("#matchinfo").textContent = ""; redraw(); return; }
  st.matches = st.tree.nodes.filter(n => n.t !== "mastery" && n.t !== "start" && ((n.n || "").toLowerCase().includes(q) || (n.s || []).some(s => s.toLowerCase().includes(q)) || (n.v || []).some(v => v.s.some(s => s.toLowerCase().includes(q)))));
  st.matchSet = new Set(st.matches.map(n => n.id));
  $("#matchinfo").textContent = st.matches.length ? `${st.matches.length} match${st.matches.length === 1 ? "" : "es"}` : "No matches";
  redraw();
}
$("#search").addEventListener("input", e => runSearch(e.target.value));
$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter" && st.matches.length){
    st.matchIdx = (st.matchIdx + (e.shiftKey ? -1 : 1) + st.matches.length) % st.matches.length;
    const n = st.matches[st.matchIdx]; select(n.id, W > 760); centerOn(n, .18);
    $("#matchinfo").textContent = `${st.matchIdx + 1} / ${st.matches.length}`;
  } else if (e.key === "Escape"){ e.target.value = ""; runSearch(""); e.target.blur(); }
});

/* ---------- share dialog ---------- */
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2200); }
async function copyText(text, input){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { input.focus(); input.select(); toast("Press Ctrl+C / long-press to copy"); }
}
function openShare(){
  $("#shareLink").value = shareURL(); $("#longLink").value = shareURL(true);
  const code = toB64url(encodeBytes());
  $("#officialCode").value = code;
  $("#officialNote").innerHTML = st.key === "ruthless"
    ? "Same binary format as pathofexile.com's atlas planner (switch it to Ruthless there)."
    : `Same binary format as pathofexile.com's atlas planner. <a style="color:var(--gold2)" href="https://www.pathofexile.com/atlas-skill-tree/${code}" target="_blank" rel="noopener">Open on pathofexile.com ↗</a>`;
  $("#importMsg").textContent = ""; $("#importMsg").className = "note";
  $("#shareDlg").showModal();
}
$("#shareBtn").addEventListener("click", openShare);
$("#dlgClose").addEventListener("click", () => $("#shareDlg").close());
$("#copyLink").addEventListener("click", () => copyText($("#shareLink").value, $("#shareLink")));
$("#copyLong").addEventListener("click", () => copyText($("#longLink").value, $("#longLink")));
$("#copyOfficial").addEventListener("click", () => copyText($("#officialCode").value, $("#officialCode")));
$("#importBtn").addEventListener("click", async () => {
  const msg = $("#importMsg"); const text = $("#importText").value;
  if (!text.trim()) return;
  const before = {a:[...st.alloc], v:[...st.variants], k:st.key};
  try {
    const dropped = await readCode(text);
    st.history.push({a:before.a, v:before.v}); $("#undoBtn").disabled = false;
    changed(false); fit(); $("#shareLink").value = shareURL(); $("#longLink").value = shareURL(true); $("#officialCode").value = toB64url(encodeBytes());
    msg.className = "note ok"; msg.textContent = `Imported ${used()} points` + (dropped > 0 ? ` (${dropped} unknown or disconnected nodes skipped)` : "");
  } catch (e){
    msg.className = "note err"; msg.textContent = "Couldn't import: " + e.message;
  }
});

/* ---------- wiring ---------- */
$("#undoBtn").addEventListener("click", undo);
$("#spawnBtn").addEventListener("click", () => { setTab("spawns"); showPanel(true); });
$("#resetBtn").addEventListener("click", reset);
$("#zin").addEventListener("click", () => zoomAt(1.4, W/2, H/2));
$("#zout").addEventListener("click", () => zoomAt(1/1.4, W/2, H/2));
$("#zfit").addEventListener("click", fit);
$("#closePanel").addEventListener("click", () => showPanel(false));
$("#panelToggle").addEventListener("click", () => showPanel($("#panel").classList.contains("hidden")));
document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#treeSel").addEventListener("change", async e => {
  const keep = {ids:[...st.alloc].filter(i => i !== START_ID), variants:[...st.variants].map(([id, idx]) => [st.byId.get(id).v[idx].e, id])};
  await loadTree(e.target.value); st.history = []; $("#undoBtn").disabled = true;
  applyDecoded(keep); st.selected = null; runSearch($("#search").value); changed(false);
});
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){ e.preventDefault(); undo(); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){ e.preventDefault(); $("#search").focus(); }
});
addEventListener("resize", resize);
new ResizeObserver(() => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px")).observe(document.querySelector("header"));
addEventListener("hashchange", async () => { if (location.hash === lastHash) return; await loadFromHash(); changed(false); });

(async function init(){
  try {
    resize();
    await loadSprites();
    const h = location.hash;
    await loadTree(/^#r1?-/.test(h) ? "ruthless" : "standard");
    if (W <= 760) showPanel(false);
    await loadFromHash();
    $("#undoBtn").disabled = true;
    changed(false); fit();
    $("#loading").remove();
  } catch (e){
    $("#loading").textContent = "Couldn't load the atlas data: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
